<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0d0d0d"><title>Warped Mirror 003</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#0d0d0d;color:#ddd;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none;user-select:none}.room{position:relative;width:100%;height:100%;max-width:520px;margin:auto;overflow:hidden;background:radial-gradient(circle at 50% 43%,#252525,#0e0e0e 72%)}.tiny{position:absolute;z-index:5;top:max(18px,env(safe-area-inset-top));left:18px;font-size:10px;letter-spacing:.18em;opacity:.3}.mirror{position:absolute;inset:11% 7% 13%;overflow:hidden;border:1px solid #666;border-radius:49% 51% 47% 53%/53% 47% 52% 48%;background:linear-gradient(116deg,#2d2d2d,#151515 45%,#282828);box-shadow:inset 0 0 80px #000,0 15px 50px #000}.mirror:after{content:"";position:absolute;inset:0;background:linear-gradient(104deg,transparent 34%,#fff1 49%,transparent 54%);pointer-events:none}.you,.other{position:absolute;width:32px;height:32px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.you{background:#ddd;box-shadow:0 0 13px #fff3}.other{border:2px solid #ddd;opacity:.78}.other:after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:#ddd;left:12px;top:12px}.ghost{position:absolute;width:4px;height:4px;border-radius:50%;background:#ddd;opacity:.12;transform:translate(-50%,-50%);pointer-events:none}.note{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));width:100%;text-align:center;font-size:10px;letter-spacing:.1em;opacity:.22}</style></head><body><main class="room"><div class="tiny">WARPED MIRROR / 003</div><div class="mirror" id="mirror"><i class="you" id="you"></i><i class="other" id="other"></i></div><div class="note">it borrows your motion</div></main><script>
const m=document.querySelector('#mirror'),y=document.querySelector('#you'),o=document.querySelector('#other');let tx=.5,ty=.5,x=.5,yy=.5,ox=.5,oy=.5,last=performance.now(),record=[],playing=false,playStart=0,quiet=0,lastInput=0;
function target(e){const r=m.getBoundingClientRect();tx=Math.max(.03,Math.min(.97,(e.clientX-r.left)/r.width));ty=Math.max(.03,Math.min(.97,(e.clientY-r.top)/r.height));lastInput=performance.now();quiet=0;playing=false}
m.addEventListener('pointerdown',target);m.addEventListener('pointermove',e=>{if(e.buttons)target(e)});
function loop(t){const dt=Math.min(32,t-last);last=t;x+=(tx-x)*.18;yy+=(ty-yy)*.18;y.style.left=x*100+'%';y.style.top=yy*100+'%';
 const moving=Math.hypot(tx-x,ty-yy)>.002;if(moving){quiet=0;if(!record.length||t-record[record.length-1].t>42){record.push({t,x,y:yy});while(record.length&&t-record[0].t>2400)record.shift()}}else quiet+=dt;
 if(quiet>700&&record.length>8&&!playing){playing=true;playStart=t}
 let gx=1-x,gy=yy;if(playing){const span=Math.max(1,record[record.length-1].t-record[0].t),pt=((t-playStart)%span)+record[0].t;let q=record[0];for(let i=1;i<record.length;i++){if(record[i].t>=pt){q=record[i];break}}gx=1-q.x;gy=q.y;if(t-lastInput<650)playing=false}
 ox+=(gx-ox)*(playing?.09:.12);oy+=(gy-oy)*(playing?.09:.12);o.style.left=ox*100+'%';o.style.top=oy*100+'%';
 if(playing&&Math.random()<.09){const g=document.createElement('i');g.className='ghost';g.style.left=ox*100+'%';g.style.top=oy*100+'%';m.appendChild(g);setTimeout(()=>g.remove(),500)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
