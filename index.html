<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05080b">
<title>Warped Mirror 008 · W-SHAPES</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#05080b;color:#c9e9f7;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none;user-select:none}
.app{height:100%;max-width:620px;margin:auto;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(circle at 50% 30%,#101923 0,#060a0e 58%,#020304 100%)}
header{padding:max(14px,env(safe-area-inset-top)) 15px 9px;border-bottom:1px solid #19333f;display:flex;justify-content:space-between;align-items:end;gap:12px}
.title{font-size:18px;letter-spacing:.04em;color:#e3f7ff}.title b{font-weight:400;color:#7ed8ff}.sub{font-size:7px;letter-spacing:.18em;opacity:.48;text-align:right;line-height:1.5}
.stage{position:relative;min-height:0;padding:10px 11px 8px}.chamber{position:relative;width:100%;height:100%;overflow:hidden;border:1px solid #214658;border-radius:19px;background:radial-gradient(circle at 50% 45%,#0a1117,#020304 76%);box-shadow:inset 0 0 70px #000,0 14px 45px #0009}
canvas{position:absolute;inset:0;width:100%;height:100%}.readout{position:absolute;left:12px;top:10px;font-size:8px;letter-spacing:.13em;line-height:1.55;opacity:.55;pointer-events:none}.legend{position:absolute;right:12px;top:10px;text-align:right;font-size:8px;letter-spacing:.12em;line-height:1.55;opacity:.55;pointer-events:none}.message{position:absolute;left:12px;right:12px;bottom:11px;text-align:center;font-size:8px;letter-spacing:.14em;opacity:.56;pointer-events:none}.panel{padding:8px 12px max(12px,env(safe-area-inset-bottom));border-top:1px solid #17313d;background:#05090ddd;backdrop-filter:blur(8px)}
.row{display:flex;align-items:end;justify-content:space-between;gap:12px}.label{font-size:8px;letter-spacing:.13em;opacity:.5}.wval{font-size:15px;letter-spacing:.08em;margin-top:2px}.track{height:32px;margin-top:8px;border:1px solid #214657;border-radius:99px;position:relative;background:#061018;overflow:hidden;touch-action:none}.track:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#7ad6ff22}.track:after{content:"-1W                 0                 +1W";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:7px;letter-spacing:.08em;opacity:.25;pointer-events:none}.needle{position:absolute;top:3px;bottom:3px;width:3px;border-radius:99px;background:#d7f4ff;box-shadow:0 0 14px #70d3ff;left:50%;transform:translateX(-50%);pointer-events:none}.controls{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:7px;margin-top:8px}button{min-height:43px;border:1px solid #28566b;border-radius:11px;background:#08141c;color:#c8efff;font:inherit;font-size:9px;letter-spacing:.08em;touch-action:manipulation}button:active{background:#123143}.note{margin-top:7px;text-align:center;font-size:7px;letter-spacing:.11em;opacity:.4;min-height:10px}
</style>
</head>
<body>
<main class="app">
<header><div class="title">Warped Mirror <b>008</b></div><div class="sub">W-SHAPES<br>THE OBJECT STAYS. YOU MOVE.</div></header>
<section class="stage"><div class="chamber" id="chamber"><canvas id="c"></canvas><div class="readout" id="readout"></div><div class="legend">OBSERVATION PLANE<br>XY ∩ W</div><div class="message" id="message">MOVE THROUGH W. WATCH WHAT EACH SHAPE BECOMES.</div></div></section>
<section class="panel">
<div class="row"><div><div class="label">CAMERA POSITION</div><div class="wval" id="wval">W +0.00</div></div><div class="label" id="seen">3 INTERSECTIONS</div></div>
<div class="track" id="track"><i class="needle" id="needle"></i></div>
<div class="controls"><button id="minus">− W</button><button id="plus">+ W</button><button id="center">RETURN 0</button></div>
<div class="note">DRAG THE W TRACK · TAP A SHAPE TO IDENTIFY IT</div>
</section>
</main>
<script>
const chamber=document.querySelector('#chamber'),c=document.querySelector('#c'),g=c.getContext('2d'),readout=document.querySelector('#readout'),wval=document.querySelector('#wval'),seen=document.querySelector('#seen'),track=document.querySelector('#track'),needle=document.querySelector('#needle'),message=document.querySelector('#message');
let W=0,lastW=0,selected=-1,dragging=false,t0=performance.now();
const shapes=[
 {name:'4-BALL',w:0.18,r:.43,x:.26,y:.29,kind:'ball',desc:'A hypersphere slice. It grows, peaks, then shrinks.'},
 {name:'TESSERACT',w:-.38,r:.31,x:.72,y:.31,kind:'box',desc:'A 4D box slice. Its face holds size, then abruptly leaves your plane.'},
 {name:'W-BRIDGE',w:-.02,r:.52,x:.50,y:.70,kind:'bridge',desc:'One connected object can appear as two separate islands in your slice.'}
];
function resize(){const r=chamber.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);c.width=r.width*d;c.height=r.height*d;g.setTransform(d,0,0,d,0,0);draw()}
addEventListener('resize',resize);
function slice(s){const dw=W-s.w,a=Math.abs(dw);if(s.kind==='ball'){if(a>=s.r)return null;return{type:'circle',scale:Math.sqrt(1-(dw*dw)/(s.r*s.r)),dw}}
 if(s.kind==='box'){if(a>=s.r)return null;return{type:'square',scale:1,dw}}
 if(s.kind==='bridge'){if(a>=s.r)return null;const q=a/s.r;const lobe=Math.max(.16,.94-q*.55);const split=.09+Math.sin(q*Math.PI)*.19;return{type:'bridge',scale:lobe,split,dw}}
}
function shapeData(){const r=chamber.getBoundingClientRect(),base=Math.min(r.width,r.height);return shapes.map((s,i)=>{const sl=slice(s);return{s,i,sl,cx:s.x*r.width,cy:s.y*r.height,unit:base*.16}})}
function glowCircle(x,y,r,alpha=1){let gr=g.createRadialGradient(x-r*.2,y-r*.22,1,x,y,r);gr.addColorStop(0,`rgba(218,247,255,${.72*alpha})`);gr.addColorStop(.55,`rgba(93,190,228,${.26*alpha})`);gr.addColorStop(1,'rgba(70,160,200,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();g.strokeStyle=`rgba(156,227,255,${.34*alpha})`;g.lineWidth=1;g.stroke()}
function draw(){const r=chamber.getBoundingClientRect();g.clearRect(0,0,r.width,r.height);const data=shapeData(),t=(performance.now()-t0)/1000;let count=0;
 // observation-plane grain
 g.fillStyle='rgba(120,210,245,.035)';for(let i=0;i<38;i++){let x=(i*97.13+t*2)%r.width,y=(i*53.77)%r.height;g.fillRect(x,y,1,1)}
 for(const d of data){if(!d.sl)continue;count++;const {s,sl,cx,cy,unit}=d,sel=selected===d.i?1:.55;
   if(sl.type==='circle'){const rr=unit*sl.scale;glowCircle(cx,cy,rr,sel);g.strokeStyle=`rgba(215,246,255,${.12*sel})`;g.beginPath();g.arc(cx,cy,rr*.72,0,Math.PI*2);g.stroke()}
   else if(sl.type==='square'){const q=unit*.95;g.save();g.translate(cx,cy);g.rotate(.10*Math.sin(t*.45));g.fillStyle=`rgba(82,168,205,${.16*sel})`;g.strokeStyle=`rgba(184,235,255,${.46*sel})`;g.lineWidth=1.2;g.fillRect(-q,-q,q*2,q*2);g.strokeRect(-q,-q,q*2,q*2);g.strokeStyle=`rgba(184,235,255,${.13*sel})`;g.strokeRect(-q*.68,-q*.68,q*1.36,q*1.36);g.restore()}
   else{const rr=unit*.75*sl.scale,dx=unit*sl.split*1.9;glowCircle(cx-dx,cy,rr,sel);glowCircle(cx+dx,cy,rr,sel);const overlap=Math.max(0,rr-dx*.72);if(overlap>3){g.strokeStyle=`rgba(126,216,250,${.18*sel})`;g.lineWidth=Math.max(2,overlap*.35);g.beginPath();g.moveTo(cx-dx*.45,cy);g.lineTo(cx+dx*.45,cy);g.stroke()}}
   if(selected===d.i){g.fillStyle='rgba(220,247,255,.72)';g.font='8px ui-monospace,monospace';g.textAlign='center';g.fillText(s.name,cx,cy+unit*1.38)}
 }
 const dir=W>lastW?'→ +W':W<lastW?'← -W':'STILL';lastW=W;wval.textContent='W '+(W>=0?'+':'')+W.toFixed(2);seen.textContent=count+' INTERSECTION'+(count===1?'':'S');needle.style.left=((W+1)/2*100)+'%';readout.innerHTML='SLICE '+(W>=0?'+':'')+W.toFixed(2)+'<br>'+dir+'<br>OBJECTS '+shapes.length+' · SEEN '+count;requestAnimationFrame(draw)}
function setW(v){W=Math.max(-1,Math.min(1,v))}
function nudge(d){setW(W+d)}
document.querySelector('#minus').onclick=()=>nudge(-.08);document.querySelector('#plus').onclick=()=>nudge(.08);document.querySelector('#center').onclick=()=>{setW(0);selected=-1;message.textContent='THE OBJECTS NEVER LEFT. ONLY THE INTERSECTION CHANGED.'};
function trackW(e){const r=track.getBoundingClientRect();setW(((e.clientX-r.left)/r.width)*2-1)}
track.addEventListener('pointerdown',e=>{dragging=true;track.setPointerCapture(e.pointerId);trackW(e)});track.addEventListener('pointermove',e=>{if(dragging)trackW(e)});track.addEventListener('pointerup',()=>dragging=false);track.addEventListener('pointercancel',()=>dragging=false);
chamber.addEventListener('pointerdown',e=>{const r=chamber.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,data=shapeData();let best=null,bd=1e9;for(const d of data){if(!d.sl)continue;const dist=Math.hypot(x-d.cx,y-d.cy);if(dist<d.unit*1.25&&dist<bd){best=d;bd=dist}}if(best){selected=best.i;message.textContent=best.s.name+' · '+best.s.desc}else{selected=-1;message.textContent='EMPTY SLICE. THE MISSING SHAPES STILL EXIST ELSEWHERE IN W.'}});
resize();requestAnimationFrame(draw);
</script>
</body>
</html>
