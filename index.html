<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0d0d0d"><title>Warped Mirror 004</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#0d0d0d;color:#ddd;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none;user-select:none}.room{position:relative;width:100%;height:100%;max-width:520px;margin:auto;overflow:hidden;background:radial-gradient(circle at 50% 43%,#252525,#0e0e0e 72%)}.tiny{position:absolute;z-index:5;top:max(18px,env(safe-area-inset-top));left:18px;font-size:10px;letter-spacing:.18em;opacity:.3}.mirror{position:absolute;inset:11% 7% 13%;overflow:hidden;border:1px solid #666;border-radius:49% 51% 47% 53%/53% 47% 52% 48%;background:linear-gradient(116deg,#2d2d2d,#151515 45%,#282828);box-shadow:inset 0 0 80px #000,0 15px 50px #000}.mirror:after{content:"";position:absolute;inset:0;background:linear-gradient(104deg,transparent 34%,#fff1 49%,transparent 54%);pointer-events:none}.you,.other{position:absolute;width:32px;height:32px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.you{background:#ddd;box-shadow:0 0 13px #fff3}.other{border:2px solid #ddd;opacity:.78;transition:opacity .2s}.other:after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:#ddd;left:12px;top:12px}.scar{position:absolute;width:8px;height:8px;border:1px solid #ddd;border-radius:50%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;animation:wake 2.8s ease-out forwards}@keyframes wake{0%{opacity:.35;width:5px;height:5px}100%{opacity:0;width:34px;height:34px}}.note{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));width:100%;text-align:center;font-size:10px;letter-spacing:.1em;opacity:.22}</style></head><body><main class="room"><div class="tiny">WARPED MIRROR / 004</div><div class="mirror" id="mirror"><i class="you" id="you"></i><i class="other" id="other"></i></div><div class="note">it notices where you stop</div></main><script>
const m=document.querySelector('#mirror'),y=document.querySelector('#you'),o=document.querySelector('#other');let tx=.5,ty=.5,x=.5,yy=.5,ox=.5,oy=.5,last=performance.now(),lastInput=0,still=0,wasStill=false;const rests=[];
function target(e){const r=m.getBoundingClientRect();tx=Math.max(.03,Math.min(.97,(e.clientX-r.left)/r.width));ty=Math.max(.03,Math.min(.97,(e.clientY-r.top)/r.height));lastInput=performance.now()}
m.addEventListener('pointerdown',target);m.addEventListener('pointermove',e=>{if(e.buttons)target(e)});
function remember(px,py){let best=null,bd=.13;for(const q of rests){const d=Math.hypot(q.x-px,q.y-py);if(d<bd){best=q;bd=d}}if(best){best.x=(best.x*best.n+px)/(best.n+1);best.y=(best.y*best.n+py)/(best.n+1);best.n=Math.min(8,best.n+1)}else rests.push({x:px,y:py,n:1});if(rests.length>6)rests.shift();const s=document.createElement('i');s.className='scar';s.style.left=px*100+'%';s.style.top=py*100+'%';m.appendChild(s);setTimeout(()=>s.remove(),2900)}
function loop(t){const dt=Math.min(32,t-last);last=t;x+=(tx-x)*.18;yy+=(ty-yy)*.18;y.style.left=x*100+'%';y.style.top=yy*100+'%';const speed=Math.hypot(tx-x,ty-yy);if(speed<.0015)still+=dt;else{still=0;wasStill=false}if(still>850&&!wasStill){remember(x,yy);wasStill=true}
let gx=1-x,gy=yy;if(rests.length&&t-lastInput>650){let best=rests[0];for(const q of rests)if(q.n>best.n)best=q;const pull=Math.min(.88,.22+best.n*.1);gx=(1-best.x)*pull+(1-x)*(1-pull);gy=best.y*pull+yy*(1-pull);o.style.opacity=.78}else o.style.opacity=.68;ox+=(gx-ox)*.075;oy+=(gy-oy)*.075;o.style.left=ox*100+'%';o.style.top=oy*100+'%';requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
