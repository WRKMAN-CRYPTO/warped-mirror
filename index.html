<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101010"><title>Warped Mirror 002</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#101010;color:#ddd;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none;user-select:none}.room{position:relative;width:100%;height:100%;max-width:520px;margin:auto;overflow:hidden;background:radial-gradient(circle at 50% 45%,#282828,#111 70%)}.tiny{position:absolute;z-index:5;top:max(18px,env(safe-area-inset-top));left:18px;font-size:10px;letter-spacing:.18em;opacity:.32}.mirror{position:absolute;inset:11% 7% 13%;overflow:hidden;border:1px solid #777;border-radius:46% 54% 49% 51%/52% 46% 54% 48%;background:linear-gradient(113deg,#303030,#171717 44%,#292929);box-shadow:inset 0 0 70px #000,0 15px 50px #000}.mirror:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,#fff1 49%,transparent 53%);pointer-events:none}.you,.other{position:absolute;width:34px;height:34px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.you{background:#ddd;box-shadow:0 0 14px #fff4}.other{border:2px solid #ddd;opacity:.8}.other:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:#ddd;left:13px;top:13px}.trail{position:absolute;width:5px;height:5px;border-radius:50%;background:#ddd;opacity:.16;transform:translate(-50%,-50%);pointer-events:none}.note{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));width:100%;text-align:center;font-size:10px;letter-spacing:.1em;opacity:.24}</style></head><body><main class="room"><div class="tiny">WARPED MIRROR / 002</div><div class="mirror" id="mirror"><i class="you" id="you"></i><i class="other" id="other"></i></div><div class="note">it learned something wrong</div></main><script>
const m=document.querySelector('#mirror'),y=document.querySelector('#you'),o=document.querySelector('#other');let tx=.5,ty=.5,ox=.5,oy=.5,vx=0,vy=0,last=performance.now(),still=0,remember=[];
function setTarget(e){const r=m.getBoundingClientRect();tx=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));ty=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));}
m.addEventListener('pointerdown',setTarget);m.addEventListener('pointermove',e=>{if(e.buttons)setTarget(e)});
function loop(t){const dt=Math.min(32,t-last);last=t;const px=parseFloat(y.dataset.x||.5),py=parseFloat(y.dataset.y||.5),nx=px+(tx-px)*.16,ny=py+(ty-py)*.16;y.dataset.x=nx;y.dataset.y=ny;y.style.left=nx*100+'%';y.style.top=ny*100+'%';
 const speed=Math.hypot(tx-px,ty-py);if(speed<.002)still+=dt;else{still=0;if(Math.random()<.09)remember.push({x:1-nx,y:ny});if(remember.length>8)remember.shift()}
 let gx=1-nx,gy=ny;if(still>500&&remember.length){const r=remember[Math.floor((t/1100)%remember.length)];gx=r.x;gy=r.y}
 const dx=gx-ox,dy=gy-oy;vx=vx*.82+dx*.035;vy=vy*.82+dy*.035;ox+=vx;oy+=vy;o.style.left=ox*100+'%';o.style.top=oy*100+'%';
 if(Math.random()<.08){const q=document.createElement('i');q.className='trail';q.style.left=ox*100+'%';q.style.top=oy*100+'%';m.appendChild(q);setTimeout(()=>q.remove(),550)}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
