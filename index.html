<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090909"><title>Warped Mirror 005</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#090909;color:#ddd;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none;user-select:none}.room{position:relative;width:100%;height:100%;max-width:560px;margin:auto;background:radial-gradient(circle at 50% 42%,#181818,#080808 72%);overflow:hidden}.tag{position:absolute;z-index:3;top:max(18px,env(safe-area-inset-top));left:18px;font-size:10px;letter-spacing:.18em;opacity:.28}.hint{position:absolute;z-index:3;bottom:max(18px,env(safe-area-inset-bottom));width:100%;text-align:center;font-size:10px;letter-spacing:.1em;opacity:.22}.slice{position:absolute;inset:9% 5% 11%;border:1px solid #4b4b4b;border-radius:30px;overflow:hidden;background:radial-gradient(circle at 50% 50%,#121212,#070707 73%);box-shadow:inset 0 0 90px #000,0 22px 70px #000}.slice:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#fff1}.slice:after{content:"";position:absolute;top:50%;left:0;right:0;height:1px;background:#fff1}canvas{display:block;width:100%;height:100%}.readout{position:absolute;right:14px;top:14px;font-size:9px;letter-spacing:.12em;opacity:.2;pointer-events:none}.blink{animation:blink .24s ease}@keyframes blink{50%{opacity:.72}}
</style></head><body><main class="room"><div class="tag">WARPED MIRROR / 005</div><section class="slice" id="slice"><canvas id="c"></canvas><div class="readout" id="readout">W = 0.00</div></section><div class="hint">touch what you can see</div></main><script>
const slice=document.querySelector('#slice'),c=document.querySelector('#c'),g=c.getContext('2d'),readout=document.querySelector('#readout');let W=0,t0=performance.now(),last=t0,pointer=null,flash=0;
const parts=[
{x:-.20,y:-.18,z:0,w:0,r:.24,a:0.00,phase:0.0,type:'body'},
{x:.09,y:-.10,z:0,w:.10,r:.20,a:.11,phase:1.2,type:'body'},
{x:.24,y:.11,z:0,w:-.08,r:.16,a:.19,phase:2.1,type:'body'},
{x:-.12,y:.17,z:0,w:.16,r:.14,a:.23,phase:3.0,type:'body'},
{x:-.32,y:.05,z:0,w:-.18,r:.12,a:.28,phase:4.2,type:'limb'},
{x:.36,y:-.02,z:0,w:.24,r:.11,a:.31,phase:5.0,type:'limb'},
{x:.04,y:.30,z:0,w:-.26,r:.10,a:.34,phase:5.8,type:'limb'},
{x:-.01,y:-.33,z:0,w:.30,r:.095,a:.37,phase:6.7,type:'limb'},
{x:-.22,y:-.20,z:0,w:-.015,r:.034,a:.02,phase:.4,type:'eye'}
];
function resize(){const r=slice.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);c.width=Math.max(1,Math.floor(r.width*d));c.height=Math.max(1,Math.floor(r.height*d));g.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function pt(e){const r=slice.getBoundingClientRect();pointer={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,t:performance.now()};flash=1;slice.classList.remove('blink');void slice.offsetWidth;slice.classList.add('blink')}
slice.addEventListener('pointerdown',e=>{slice.setPointerCapture?.(e.pointerId);pt(e)});slice.addEventListener('pointermove',e=>{if(e.buttons)pt(e)});slice.addEventListener('pointerup',()=>pointer=null);slice.addEventListener('pointercancel',()=>pointer=null);
function draw(t){const dt=Math.min(40,t-last);last=t;const r=slice.getBoundingClientRect(),w=r.width,h=r.height,scale=Math.min(w,h)*.72,cx=w*.5,cy=h*.5;
const time=(t-t0)/1000;W=Math.sin(time*.43)*.27+Math.sin(time*.17+1.7)*.11;let avoid=0;
if(pointer){const px=(pointer.x-.5)*w,py=(pointer.y-.5)*h;for(const p of parts){const dw=p.w-W;if(Math.abs(dw)>=p.r)continue;const vr=Math.sqrt(Math.max(0,p.r*p.r-dw*dw))*scale;const sx=cx+p.x*scale,sy=cy+p.y*scale;if(Math.hypot(sx-(px+w*.5),sy-(py+h*.5))<vr+48){avoid+=.018*(1-Math.min(1,Math.abs(dw)/p.r))}}}
W+=avoid;readout.textContent='W = '+W.toFixed(2);g.clearRect(0,0,w,h);
g.save();g.globalCompositeOperation='lighter';
const visible=[];for(const p of parts){const drift=Math.sin(time*(p.a+.18)+p.phase)*.025;const dw=(p.w+drift)-W;if(Math.abs(dw)>=p.r)continue;const vr=Math.sqrt(Math.max(0,p.r*p.r-dw*dw))*scale;const sx=cx+(p.x+Math.sin(time*.31+p.phase)*.012)*scale,sy=cy+(p.y+Math.cos(time*.27+p.phase)*.012)*scale;visible.push({p,vr,sx,sy,dw});}
for(let i=0;i<visible.length;i++)for(let j=i+1;j<visible.length;j++){const a=visible[i],b=visible[j];const d=Math.hypot(a.sx-b.sx,a.sy-b.sy);if(d<scale*.33&&a.p.type!=='eye'&&b.p.type!=='eye'){g.strokeStyle='rgba(220,220,220,.10)';g.lineWidth=Math.max(1,Math.min(a.vr,b.vr)*.18);g.beginPath();g.moveTo(a.sx,a.sy);g.lineTo(b.sx,b.sy);g.stroke()}}
for(const v of visible){const q=v.p;if(q.type==='eye')continue;const grad=g.createRadialGradient(v.sx-v.vr*.22,v.sy-v.vr*.24,1,v.sx,v.sy,v.vr);grad.addColorStop(0,'rgba(238,238,238,.55)');grad.addColorStop(.66,q.type==='limb'?'rgba(170,170,170,.25)':'rgba(205,205,205,.31)');grad.addColorStop(1,'rgba(220,220,220,.025)');g.fillStyle=grad;g.beginPath();g.arc(v.sx,v.sy,v.vr,0,Math.PI*2);g.fill();g.strokeStyle='rgba(240,240,240,.18)';g.lineWidth=1;g.stroke()}
for(const v of visible){if(v.p.type!=='eye')continue;const rr=Math.max(2.2,v.vr);g.fillStyle='rgba(245,245,245,.92)';g.beginPath();g.arc(v.sx,v.sy,rr,0,Math.PI*2);g.fill();g.fillStyle='rgba(0,0,0,.75)';g.beginPath();g.arc(v.sx+rr*.18,v.sy,Math.max(1,rr*.32),0,Math.PI*2);g.fill()}
g.restore();flash*=.92;if(flash>.02){g.strokeStyle='rgba(255,255,255,'+(flash*.12)+')';g.lineWidth=1;g.strokeRect(.5,.5,w-1,h-1)}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
