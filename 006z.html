<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>Warped Mirror 006Z</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#050505;color:#ddd;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none;user-select:none}.room{position:relative;width:100%;height:100%;max-width:560px;margin:auto;background:radial-gradient(circle at 50% 45%,#151515,#050505 75%);overflow:hidden}.tag{position:absolute;z-index:5;top:max(18px,env(safe-area-inset-top));left:18px;font-size:10px;letter-spacing:.18em;opacity:.32}.hint{position:absolute;z-index:5;bottom:max(18px,env(safe-area-inset-bottom));width:100%;text-align:center;font-size:9px;letter-spacing:.12em;opacity:.2}.slice{position:absolute;inset:9% 5% 11%;border:1px solid #3d3d3d;border-radius:30px;overflow:hidden;background:radial-gradient(circle,#101010,#040404 76%);box-shadow:inset 0 0 90px #000,0 22px 70px #000}.slice:before,.slice:after{content:"";position:absolute;pointer-events:none;z-index:2;background:#fff1}.slice:before{left:50%;top:0;bottom:0;width:1px}.slice:after{top:50%;left:0;right:0;height:1px}canvas{display:block;width:100%;height:100%}.readout{position:absolute;z-index:4;right:14px;top:14px;font-size:9px;line-height:1.55;letter-spacing:.12em;opacity:.22;text-align:right;pointer-events:none}.zero{position:absolute;z-index:4;left:10px;right:10px;top:50%;height:1px;background:#fff2;pointer-events:none}.zero:after{content:'0';position:absolute;right:0;top:4px;font-size:8px;opacity:.4}</style></head><body><main class="room"><div class="tag">WARPED MIRROR / 006Z</div><section class="slice" id="slice"><canvas id="c"></canvas><div class="zero"></div><div class="readout" id="readout"></div></section><div class="hint">drag vertically through zero</div></main><script>const s=document.querySelector('#slice'),c=document.querySelector('#c'),g=c.getContext('2d'),out=document.querySelector('#readout');let last=performance.now(),T=0,z=.62,target=.62,held=false,flash=0;const pts=[];for(let i=0;i<18;i++){let a=i/18*Math.PI*2,r=.25+.07*Math.sin(i*2.17);pts.push([Math.cos(a)*r,Math.sin(a)*r,.18*Math.sin(a*3)+.07*Math.cos(a*5)])}function resize(){let r=s.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);c.width=r.width*d;c.height=r.height*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function setZ(e){let r=s.getBoundingClientRect(),ny=(e.clientY-r.top)/r.height;target=(.5-ny)*2.4;held=true}s.addEventListener('pointerdown',e=>{s.setPointerCapture?.(e.pointerId);setZ(e)});s.addEventListener('pointermove',e=>{if(e.buttons)setZ(e)});s.addEventListener('pointerup',()=>held=false);s.addEventListener('pointercancel',()=>held=false);function frame(now){let dt=Math.min(40,now-last)/1000;last=now;T+=dt;if(!held)target=.58*Math.sin(T*.29)+.18*Math.sin(T*.11+2);let prev=z;z+=(target-z)*Math.min(1,dt*5);if(prev*z<0)flash=1;let r=s.getBoundingClientRect(),w=r.width,h=r.height,cx=w/2,cy=h/2,S=Math.min(w,h);g.clearRect(0,0,w,h);let eps=.055,den=Math.abs(z)<eps?(z<0?-eps:eps):z,scale=.18/Math.abs(den);scale=Math.min(5.2,scale);let flip=z<0?-1:1,rot=T*.16;let projected=[];for(let i=0;i<pts.length;i++){let p=pts[i],x=p[0],y=p[1],q=p[2];let xr=x*Math.cos(rot)-q*Math.sin(rot),qr=x*Math.sin(rot)+q*Math.cos(rot);let breathe=1+.06*Math.sin(T*.7+i*.8);projected.push([cx+xr*S*scale*flip*breathe,cy+y*S*scale*flip*breathe,qr,i])}g.save();g.globalCompositeOperation='lighter';for(let i=0;i<projected.length;i++){let a=projected[i],b=projected[(i+1)%projected.length];g.strokeStyle='rgba(220,220,220,'+(.08+.12/(1+Math.abs(z)*3))+')';g.lineWidth=1+Math.min(5,scale*.6);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()}for(const p of projected){let rr=Math.max(1.5,Math.min(22,(3.2+p[2]*4)*scale));let grad=g.createRadialGradient(p[0]-rr*.25,p[1]-rr*.25,1,p[0],p[1],rr);grad.addColorStop(0,'rgba(245,245,245,.75)');grad.addColorStop(.65,'rgba(180,180,180,.2)');grad.addColorStop(1,'rgba(220,220,220,.01)');g.fillStyle=grad;g.beginPath();g.arc(p[0],p[1],rr,0,Math.PI*2);g.fill()}g.restore();if(Math.abs(z)<.11){let a=(.11-Math.abs(z))/.11;g.fillStyle='rgba(255,255,255,'+(a*.035)+')';g.fillRect(0,0,w,h)}flash*=.9;if(flash>.02){g.strokeStyle='rgba(255,255,255,'+(flash*.25)+')';g.lineWidth=1;g.strokeRect(.5,.5,w-1,h-1)}out.innerHTML='Z '+(z>=0?'+':'')+z.toFixed(3)+'<br>'+ (Math.abs(z)<.055?'UNRESOLVED':z<0?'FAR SIDE':'NEAR SIDE');requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></body></html>
