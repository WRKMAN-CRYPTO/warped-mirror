<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#030406">
<title>Warped Mirror 012 · PERIPHERAL ANIMAL</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#020304;color:#dff8ff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none;user-select:none}
.app{height:100%;max-width:620px;margin:auto;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(circle at 50% 42%,#0b1217 0,#040608 58%,#010203 100%)}
header{padding:max(14px,env(safe-area-inset-top)) 15px 10px;border-bottom:1px solid #17303a;display:flex;justify-content:space-between;align-items:end;gap:12px}
.title{font-size:18px;letter-spacing:.04em}.title b{font-weight:400;color:#89e7ff}.sub{font-size:7px;letter-spacing:.17em;opacity:.43;text-align:right;line-height:1.5}
.stage{min-height:0;padding:10px}.chamber{height:100%;position:relative;overflow:hidden;border:1px solid #21424f;border-radius:20px;background:radial-gradient(circle at 50% 48%,#071017,#020304 75%);box-shadow:inset 0 0 80px #000,0 15px 45px #0009}
canvas{position:absolute;inset:0;width:100%;height:100%}
.readout,.hint,.stillness{position:absolute;pointer-events:none;font-size:8px;letter-spacing:.13em;line-height:1.5;opacity:.48}
.readout{left:12px;top:10px}.stillness{right:12px;top:10px;text-align:right}.hint{left:14px;right:14px;bottom:12px;text-align:center}
.panel{padding:9px 12px max(12px,env(safe-area-inset-bottom));border-top:1px solid #17303a;background:#05090ddd;backdrop-filter:blur(8px)}
.row{display:flex;justify-content:space-between;align-items:end;gap:10px}.label{font-size:8px;letter-spacing:.13em;opacity:.48}.status{font-size:14px;letter-spacing:.08em;margin-top:3px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
button{min-height:43px;border:1px solid #2a566b;border-radius:11px;background:#08131b;color:#cdf1ff;font:inherit;font-size:9px;letter-spacing:.08em;touch-action:manipulation}
button:active{background:#123043}
</style>
</head>
<body>
<main class="app">
<header><div class="title">Warped Mirror <b>012</b></div><div class="sub">PERIPHERAL ANIMAL<br>LOOK AWAY TO SEE IT</div></header>
<section class="stage"><div class="chamber" id="ch"><canvas id="c"></canvas><div class="readout" id="readout"></div><div class="stillness" id="stillness"></div><div class="hint" id="hint">TOUCH THE DARK. TRY TO FIND IT.</div></div></section>
<section class="panel">
<div class="row"><div><div class="label">INSTRUMENT REPORT</div><div class="status" id="status">NOTHING TO IDENTIFY</div></div><div class="label" id="pieces">0 / 26 PIECES</div></div>
<div class="buttons"><button id="forget">FORGET WHERE</button><button id="leave">STOP LOOKING</button></div>
</section>
</main>
<script>
const ch=document.querySelector('#ch'),c=document.querySelector('#c'),g=c.getContext('2d');
const readout=document.querySelector('#readout'),stillnessOut=document.querySelector('#stillness'),hint=document.querySelector('#hint'),status=document.querySelector('#status'),piecesOut=document.querySelector('#pieces');
let t0=performance.now(),last=t0,ptr={x:0,y:0,down:false},still=0,lastTouch=performance.now(),auto=false,autoUntil=0,blink=0;
const P=[];
const add=(x,y,r,p,k='body')=>P.push({x,y,r,p,k});
[[-.34,-.10,.06,.3],[-.27,-.20,.072,.8],[-.17,-.25,.073,1.2],[-.07,-.22,.068,1.8],[.34,-.10,.06,3.1],[.27,-.20,.072,2.7],[.17,-.25,.073,2.3],[.07,-.22,.068,2.0],[-.31,.02,.07,.5],[-.22,.05,.082,1],[-.12,.02,.083,1.4],[-.04,-.01,.078,1.9],[.31,.02,.07,3.5],[.22,.05,.082,3],[.12,.02,.083,2.6],[.04,-.01,.078,2.1],[-.24,.15,.07,.6],[-.15,.18,.072,1.1],[-.07,.17,.068,1.7],[.24,.15,.07,3.7],[.15,.18,.072,3.2],[.07,.17,.068,2.5],[0,.25,.064,2,'tail'],[0,.34,.048,2.6,'tail'],[-.055,-.085,.046,1.5,'face'],[.055,-.085,.046,2.6,'face']].forEach(q=>add(...q));
function resize(){const r=ch.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);c.width=r.width*d;c.height=r.height*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),ease=v=>v*v*(3-2*v);
function home(p,r,t){const S=Math.min(r.width,r.height)*.74,b=1+.018*Math.sin(t*.8);return{x:r.width*.5+p.x*S*b+Math.sin(t*.31+p.p)*S*.008,y:r.height*.49+p.y*S+Math.cos(t*.27+p.p)*S*.008,rad:p.r*S*(1+.05*Math.sin(t*.9+p.p))}}
function att(now,r,t){if(auto&&now<autoUntil)return{on:true,x:r.width*(.5+.34*Math.sin(t*.81)+.08*Math.sin(t*2.1)),y:r.height*(.48+.30*Math.cos(t*.69))};if(auto&&now>=autoUntil)auto=false;return{on:ptr.down,x:ptr.x,y:ptr.y}}
function vis(h,a,r,t,p){const d=Math.hypot(h.x-a.x,h.y-a.y),focus=Math.min(r.width,r.height)*.19,inspect=a.on?clamp(1-d/focus,0,1):0,w=Math.sin(t*.34+p.p)*.10+inspect*.92,slice=Math.max(0,1-Math.abs(w)/.62),per=a.on?clamp(d/(focus*.74),0,1):1;return{v:ease(slice)*(.20+.80*per),inspect}}
function eye(cx,cy,s,open,a){if(open<=.02)return;g.save();g.globalAlpha=open;g.fillStyle='rgba(215,248,255,.10)';g.shadowBlur=18;g.shadowColor='#9ceaff';g.beginPath();g.ellipse(cx,cy,s*.56,s*.34,0,0,Math.PI*2);g.fill();g.shadowBlur=0;g.strokeStyle='rgba(205,247,255,.58)';g.beginPath();g.ellipse(cx,cy,s*.56,s*.34,0,0,Math.PI*2);g.stroke();g.fillStyle='rgba(1,3,4,.94)';g.beginPath();g.ellipse(cx,cy,s*.15,s*.23,0,0,Math.PI*2);g.fill();if(a.on){const dx=clamp((a.x-cx)/180,-1,1)*s*.08,dy=clamp((a.y-cy)/180,-1,1)*s*.06;g.fillStyle='#efffff';g.beginPath();g.arc(cx+dx,cy+dy,s*.035,0,Math.PI*2);g.fill()}g.restore()}
function frame(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;const r=ch.getBoundingClientRect(),t=(now-t0)/1000,a=att(now,r,t),idle=(now-lastTouch)/1000;
 still=clamp(still+(a.on?-dt*.9:dt*(idle>1.1?.23:.05)),0,1);blink=Math.max(0,blink-dt*3);
 g.clearRect(0,0,r.width,r.height);g.fillStyle='#020405';g.fillRect(0,0,r.width,r.height);
 for(let i=0;i<32;i++){g.fillStyle='rgba(130,225,255,.022)';g.fillRect((i*79.17+t*2.3)%r.width,(i*47.91)%r.height,1,1)}
 let homes=[],vals=[],visible=0;
 for(const p of P){const h=home(p,r,t),q=vis(h,a,r,t,p);homes.push(h);vals.push(q);if(q.v>.055)visible++}
 if(still>.18){g.save();g.globalAlpha=(still-.18)/.82*.22;g.strokeStyle='#b9f2ff';g.setLineDash([2,7]);for(let i=1;i<P.length;i++){const pa=P[i-1],pb=P[i];if((pa.x<0)!=(pb.x<0)&&pa.k!=='face'&&pb.k!=='face')continue;const A=homes[i-1],B=homes[i];g.beginPath();g.moveTo(A.x,A.y);g.lineTo(B.x,B.y);g.stroke()}g.restore()}
 for(let i=0;i<P.length;i++){const p=P[i],h=homes[i],q=vals[i];if(q.v<=.015)continue;const jit=(1-still)*8,jx=Math.sin(t*2.1+p.p*3.1)*jit*q.inspect,jy=Math.cos(t*1.8+p.p*2.4)*jit*q.inspect,rr=h.rad*(.28+.72*q.v);g.save();g.translate(h.x+jx,h.y+jy);g.rotate(Math.sin(t*.21+p.p)*.18);g.globalAlpha=.08+.88*q.v;g.fillStyle=p.k==='face'?'#ffd1c5':'#7ddfff';g.shadowBlur=10+18*still;g.shadowColor=p.k==='face'?'#ff9d8b':'#63d9ff';g.beginPath();if(p.k==='tail')g.ellipse(0,0,rr*.72,rr*1.15,0,0,Math.PI*2);else g.ellipse(0,0,rr,rr*.72,0,0,Math.PI*2);g.fill();g.restore()}
 const cx=r.width*.5,cy=r.height*.49-Math.min(r.width,r.height)*.07,eyeOpen=clamp((still-.54)/.30,0,1)*(1-blink);
 eye(cx,cy,Math.min(r.width,r.height)*.17,eyeOpen,a);
 if(eyeOpen>.68&&Math.sin(t*1.13)>.992)blink=1;
 piecesOut.textContent=visible+' / 26 PIECES';stillnessOut.innerHTML='STILLNESS<br>'+Math.round(still*100)+'%';
 const coherence=Math.round(still*100);
 readout.innerHTML='ATTENTION: '+(a.on?'LOCKED':'FREE')+'<br>COHERENCE: '+coherence+'%';
 status.textContent=still>.82?'ONE THING, PROBABLY':still>.55?'PATTERN FORMING':a.on?'IT MOVES SIDEWAYS':'NOTHING TO IDENTIFY';
 if(a.on&&visible<10)hint.textContent='YOU ARE LOOKING DIRECTLY AT IT.';
 else if(still>.78)hint.textContent='DON’T TOUCH IT.';
 else if(!a.on&&idle>1.2)hint.textContent='SOMETHING IS ASSEMBLING IN THE PERIPHERY.';
 requestAnimationFrame(frame)
}
function pos(e){const r=ch.getBoundingClientRect();ptr.x=e.clientX-r.left;ptr.y=e.clientY-r.top;lastTouch=performance.now()}
ch.addEventListener('pointerdown',e=>{ch.setPointerCapture?.(e.pointerId);ptr.down=true;pos(e);still=Math.min(still,.25);hint.textContent='FOUND SOMETHING. LOST SOMETHING ELSE.'});
ch.addEventListener('pointermove',e=>{if(ptr.down)pos(e)});ch.addEventListener('pointerup',()=>ptr.down=false);ch.addEventListener('pointercancel',()=>ptr.down=false);
document.querySelector('#forget').onclick=()=>{still=0;lastTouch=performance.now();hint.textContent='YOU FORGOT THE PATTERN.'};
document.querySelector('#leave').onclick=()=>{ptr.down=false;auto=true;autoUntil=performance.now()+2400;still=0;lastTouch=performance.now();hint.textContent='THE INSTRUMENT LOOKS FOR YOU.'};
requestAnimationFrame(frame);
</script>
</body>
</html>
