<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05080b">
<title>Warped Mirror 009 · SIDEWAYS KNOT</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#030506;color:#d9f5ff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none;user-select:none}
.app{height:100%;max-width:620px;margin:auto;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(circle at 50% 42%,#0c151b 0,#05080b 58%,#010203 100%)}
header{padding:max(14px,env(safe-area-inset-top)) 15px 10px;border-bottom:1px solid #17323d;display:flex;justify-content:space-between;align-items:end;gap:12px}
.title{font-size:18px;letter-spacing:.04em}.title b{font-weight:400;color:#7edcff}.sub{font-size:7px;letter-spacing:.17em;opacity:.45;text-align:right;line-height:1.5}
.stage{min-height:0;padding:10px}.chamber{height:100%;position:relative;overflow:hidden;border:1px solid #214655;border-radius:20px;background:radial-gradient(circle at 50% 50%,#081017,#020304 74%);box-shadow:inset 0 0 75px #000,0 15px 45px #0009}
canvas{position:absolute;inset:0;width:100%;height:100%}.readout,.hint{position:absolute;pointer-events:none;font-size:8px;letter-spacing:.13em;line-height:1.5;opacity:.5}.readout{left:12px;top:10px}.hint{left:12px;right:12px;bottom:12px;text-align:center}.panel{padding:8px 12px max(12px,env(safe-area-inset-bottom));border-top:1px solid #17313d;background:#05090ddd;backdrop-filter:blur(8px)}
.row{display:flex;justify-content:space-between;align-items:end;gap:10px}.label{font-size:8px;letter-spacing:.13em;opacity:.5}.wval{font-size:15px;margin-top:2px;letter-spacing:.08em}.track{height:34px;margin-top:8px;border:1px solid #235062;border-radius:99px;position:relative;background:#061018;overflow:hidden}.track:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#92e6ff30}.track:after{content:"-1W                 0                 +1W";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:7px;letter-spacing:.07em;opacity:.23;pointer-events:none}.needle{position:absolute;top:3px;bottom:3px;width:3px;border-radius:99px;background:#dff8ff;box-shadow:0 0 16px #6fdcff;left:50%;transform:translateX(-50%);pointer-events:none}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}button{min-height:43px;border:1px solid #28566b;border-radius:11px;background:#08141c;color:#caefff;font:inherit;font-size:9px;letter-spacing:.09em}button:active{background:#123143}
</style>
</head>
<body>
<main class="app">
<header><div class="title">Warped Mirror <b>009</b></div><div class="sub">SIDEWAYS KNOT<br>CONNECTED ELSEWHERE</div></header>
<section class="stage"><div class="chamber" id="ch"><canvas id="c"></canvas><div class="readout" id="readout"></div><div class="hint" id="hint">DRAG W. THE GAPS ARE NOT BREAKS.</div></div></section>
<section class="panel"><div class="row"><div><div class="label">YOUR SLICE</div><div class="wval" id="wval">W +0.00</div></div><div class="label" id="pieces">0 VISIBLE ARCS</div></div><div class="track" id="track"><i class="needle" id="needle"></i></div><div class="buttons"><button id="drift">LET IT DRIFT</button><button id="zero">FIND THE MIDDLE</button></div></section>
</main>
<script>
const ch=document.querySelector('#ch'),c=document.querySelector('#c'),g=c.getContext('2d'),track=document.querySelector('#track'),needle=document.querySelector('#needle'),wval=document.querySelector('#wval'),pieces=document.querySelector('#pieces'),readout=document.querySelector('#readout'),hint=document.querySelector('#hint');
let W=0,drag=false,auto=true,t0=performance.now(),lastVisible=0;
function resize(){const r=ch.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);c.width=r.width*d;c.height=r.height*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function knot(u){const a=u*Math.PI*2;return{x:Math.sin(a)+.46*Math.sin(3*a),y:.82*Math.cos(a)-.30*Math.cos(2*a),w:.62*Math.sin(2*a+.55)+.22*Math.sin(5*a)}}
function sample(){const arr=[];for(let i=0;i<=420;i++){const u=i/420,p=knot(u);arr.push({...p,u})}return arr}const pts=sample();
function draw(){const r=ch.getBoundingClientRect(),now=performance.now(),t=(now-t0)/1000;if(auto&&!drag)W=.72*Math.sin(t*.27);g.clearRect(0,0,r.width,r.height);
 for(let i=0;i<36;i++){g.fillStyle='rgba(120,220,255,.035)';g.fillRect((i*83.7+t*1.3)%r.width,(i*49.2)%r.height,1,1)}
 const cx=r.width/2,cy=r.height/2,s=Math.min(r.width,r.height)*.28,band=.18;let runs=0,inRun=false,visible=0;
 for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],da=Math.abs(a.w-W),db=Math.abs(b.w-W),ok=da<band&&db<band;if(ok){visible++;if(!inRun){runs++;inRun=true}const fa=1-da/band,fb=1-db/band,alpha=.16+.72*Math.min(fa,fb),lw=1.3+3.8*Math.min(fa,fb);g.strokeStyle=`rgba(133,224,255,${alpha})`;g.lineWidth=lw;g.lineCap='round';g.beginPath();g.moveTo(cx+a.x*s,cy+a.y*s);g.lineTo(cx+b.x*s,cy+b.y*s);g.stroke();if(Math.min(fa,fb)>.72){g.strokeStyle=`rgba(225,250,255,${.18*alpha})`;g.lineWidth=lw*2.5;g.beginPath();g.moveTo(cx+a.x*s,cy+a.y*s);g.lineTo(cx+b.x*s,cy+b.y*s);g.stroke()}}else inRun=false}
 if(visible===0){g.fillStyle='rgba(220,247,255,.2)';g.font='9px ui-monospace,monospace';g.textAlign='center';g.fillText('THE KNOT IS STILL HERE',cx,cy)}
 if(runs!==lastVisible){if(runs>=4)hint.textContent='ONE LOOP. '+runs+' PIECES IN YOUR SLICE.';else if(runs===1)hint.textContent='FOR A MOMENT, IT LOOKS ALMOST ORDINARY.';else hint.textContent='THE GAPS ARE NOT BREAKS.';lastVisible=runs}
 needle.style.left=((W+1)/2*100)+'%';wval.textContent='W '+(W>=0?'+':'')+W.toFixed(2);pieces.textContent=runs+' VISIBLE ARC'+(runs===1?'':'S');readout.innerHTML='OBJECT: 1 LOOP<br>VISIBLE: '+runs+' ARC'+(runs===1?'':'S')+'<br>HIDDEN: '+Math.max(0,Math.round((1-visible/420)*100))+'%';requestAnimationFrame(draw)}
function setW(v){W=Math.max(-1,Math.min(1,v));auto=false}
function fromPointer(e){const r=track.getBoundingClientRect();setW(((e.clientX-r.left)/r.width)*2-1)}
track.addEventListener('pointerdown',e=>{drag=true;track.setPointerCapture(e.pointerId);fromPointer(e)});track.addEventListener('pointermove',e=>{if(drag)fromPointer(e)});track.addEventListener('pointerup',()=>drag=false);track.addEventListener('pointercancel',()=>drag=false);
document.querySelector('#drift').onclick=()=>{auto=true;t0=performance.now()-Math.asin(Math.max(-1,Math.min(1,W/.72)))/.27*1000;hint.textContent='NO HANDS. JUST CROSS-SECTIONS.'};document.querySelector('#zero').onclick=()=>{setW(0);hint.textContent='THE MIDDLE IS NOT THE WHOLE.'};
requestAnimationFrame(draw);
</script>
</body>
</html>
