<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#040507">
<title>Warped Mirror 011 · COMMON NERVE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#020304;color:#dff8ff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;touch-action:none;user-select:none}
.app{height:100%;max-width:620px;margin:auto;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(circle at 50% 44%,#0b1318 0,#040608 58%,#010203 100%)}
header{padding:max(14px,env(safe-area-inset-top)) 15px 10px;border-bottom:1px solid #17303a;display:flex;justify-content:space-between;align-items:end;gap:12px}
.title{font-size:18px;letter-spacing:.04em}.title b{font-weight:400;color:#85e4ff}.sub{font-size:7px;letter-spacing:.17em;opacity:.43;text-align:right;line-height:1.5}
.stage{min-height:0;padding:10px}.chamber{height:100%;position:relative;overflow:hidden;border:1px solid #214352;border-radius:20px;background:radial-gradient(circle at 50% 50%,#071018,#020304 74%);box-shadow:inset 0 0 80px #000,0 15px 45px #0009}
canvas{position:absolute;inset:0;width:100%;height:100%}.readout,.hint{position:absolute;pointer-events:none;font-size:8px;letter-spacing:.13em;line-height:1.5;opacity:.48}.readout{left:12px;top:10px}.hint{left:14px;right:14px;bottom:12px;text-align:center}
.panel{padding:9px 12px max(12px,env(safe-area-inset-bottom));border-top:1px solid #17303a;background:#05090ddd;backdrop-filter:blur(8px)}
.row{display:flex;justify-content:space-between;align-items:end;gap:10px}.label{font-size:8px;letter-spacing:.13em;opacity:.48}.wval{font-size:14px;letter-spacing:.08em;margin-top:3px}
.track{height:34px;margin-top:8px;border:1px solid #28566b;border-radius:99px;position:relative;background:#071018;overflow:hidden}
.track:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:#9ee9ff2a}.track:after{content:"-1W                 0                 +1W";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:7px;letter-spacing:.06em;opacity:.24}
.needle{position:absolute;top:3px;bottom:3px;width:3px;border-radius:99px;background:#e7fbff;box-shadow:0 0 16px #75ddff;left:50%;transform:translateX(-50%)}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}button{min-height:43px;border:1px solid #2a566b;border-radius:11px;background:#08131b;color:#cdf1ff;font:inherit;font-size:9px;letter-spacing:.08em}button:active{background:#123043}
</style>
</head>
<body>
<main class="app">
<header><div class="title">Warped Mirror <b>011</b></div><div class="sub">COMMON NERVE<br>TWO PIECES, ONE FLINCH</div></header>
<section class="stage"><div class="chamber" id="ch"><canvas id="c"></canvas><div class="readout" id="readout"></div><div class="hint" id="hint">TOUCH EITHER PIECE.</div></div></section>
<section class="panel">
<div class="row"><div><div class="label">YOUR SLICE</div><div class="wval" id="wval">W +0.00</div></div><div class="label" id="pieces">2 VISIBLE PIECES</div></div>
<div class="track" id="track"><i class="needle" id="needle"></i></div>
<div class="buttons"><button id="drift">LET IT BREATHE</button><button id="call">CALL IT</button></div>
</section>
</main>
<script>
const ch=document.querySelector('#ch'),c=document.querySelector('#c'),g=c.getContext('2d'),track=document.querySelector('#track'),needle=document.querySelector('#needle'),wval=document.querySelector('#wval'),pieces=document.querySelector('#pieces'),readout=document.querySelector('#readout'),hint=document.querySelector('#hint');
let W=0,auto=true,drag=false,t0=performance.now(),shock=0,shockSide=0,call=0,last=performance.now(),pointer={x:0,y:0,down:false};
function resize(){const r=ch.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);c.width=r.width*d;c.height=r.height*d;g.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function body(t,r){
 const breathe=.5+.5*Math.sin(t*.9),s=Math.min(r.width,r.height),cx=r.width*.5,cy=r.height*.49;
 return[
  {x:cx-s*(.21+.018*Math.sin(t*.7)),y:cy+s*.045*Math.sin(t*.63),w:-.34+.08*Math.sin(t*.41),base:s*.145,eye:W<-.18},
  {x:cx+s*(.21+.018*Math.cos(t*.66)),y:cy-s*.045*Math.cos(t*.58),w:.34+.08*Math.cos(t*.37),base:s*.145,eye:W>.18},
  {breathe}
 ]
}
function vis(part){const d=Math.abs(W-part.w),band=.55;return d>=band?0:Math.pow(1-d/band,.62)}
function drawBlob(p,v,t,side){
 if(v<=0)return;
 const pulse=1+shock*.19*(side===shockSide?1:.72),r=p.base*(.42+.58*v)*pulse,wiggle=Math.sin(t*2.2+side*1.9)*r*.05;
 g.save();g.translate(p.x+wiggle,p.y);g.rotate((side?-.18:.18)+Math.sin(t*.5+side)*.05);
 g.globalAlpha=.1+.86*v;
 g.fillStyle=side?'#ff8b74':'#70dcff';
 g.shadowBlur=18+shock*18;g.shadowColor=side?'#ff7d68':'#66d8ff';
 g.beginPath();g.ellipse(0,0,r*1.08,r*.82,0,0,Math.PI*2);g.fill();
 g.shadowBlur=0;g.strokeStyle='rgba(230,250,255,.45)';g.lineWidth=1;g.beginPath();g.ellipse(0,0,r*1.08,r*.82,0,0,Math.PI*2);g.stroke();
 if(v>.55){
  const ex=(side?-1:1)*r*.22,ey=-r*.07,open=Math.max(.08,1-shock*.92);
  g.fillStyle='rgba(2,4,5,.88)';g.beginPath();g.ellipse(ex,ey,r*.18,r*.22*open,0,0,Math.PI*2);g.fill();
  if(open>.35){g.fillStyle='rgba(235,252,255,.92)';g.beginPath();g.arc(ex+(pointer.x-p.x)*.018,ey+(pointer.y-p.y)*.012,r*.055,0,Math.PI*2);g.fill()}
 }
 g.restore()
}
function ripple(x,y,a){
 g.strokeStyle='rgba(210,247,255,'+a+')';g.lineWidth=1;g.beginPath();g.arc(x,y,12+(1-a)*52,0,Math.PI*2);g.stroke()
}
function draw(now){
 const dt=Math.min(.04,(now-last)/1000);last=now;const r=ch.getBoundingClientRect(),t=(now-t0)/1000;
 if(auto&&!drag)W=.68*Math.sin(t*.23);
 shock=Math.max(0,shock-dt*2.3);call=Math.max(0,call-dt*1.4);
 const B=body(t,r),a=B[0],b=B[1],va=vis(a),vb=vis(b);
 if(call>0){const pull=call*16;a.x+=pull;b.x-=pull}
 g.clearRect(0,0,r.width,r.height);g.fillStyle='#020405';g.fillRect(0,0,r.width,r.height);
 for(let i=0;i<28;i++){g.fillStyle='rgba(120,220,255,.025)';g.fillRect((i*89.3+t*.9)%r.width,(i*53.7)%r.height,1,1)}
 const nerve=.05+.10*shock;
 if(shock>.02){
  g.strokeStyle='rgba(190,244,255,'+nerve+')';g.lineWidth=1;g.setLineDash([2,9]);g.beginPath();g.moveTo(a.x,a.y);g.quadraticCurveTo(r.width*.5,r.height*(.33+.34*Math.sin(t*1.8)),b.x,b.y);g.stroke();g.setLineDash([])
 }
 drawBlob(a,va,t,0);drawBlob(b,vb,t,1);
 if(shock>.02){ripple(a.x,a.y,shock*.34);ripple(b.x,b.y,shock*.34)}
 const visible=(va>.03?1:0)+(vb>.03?1:0);pieces.textContent=visible+' VISIBLE PIECE'+(visible===1?'':'S');
 needle.style.left=((W+1)/2*100)+'%';wval.textContent='W '+(W>=0?'+':'')+W.toFixed(2);
 readout.innerHTML='OBJECTS: 1?<br>VISIBLE: '+visible+'<br>NERVE RESPONSE: '+(shock>.02?'SHARED':'QUIET');
 if(visible===0)hint.textContent='NOTHING HERE. TOUCH WHERE IT WAS.';
 requestAnimationFrame(draw)
}
function setW(v){W=Math.max(-1,Math.min(1,v));auto=false}
function fromTrack(e){const r=track.getBoundingClientRect();setW(((e.clientX-r.left)/r.width)*2-1)}
track.addEventListener('pointerdown',e=>{drag=true;track.setPointerCapture(e.pointerId);fromTrack(e)});
track.addEventListener('pointermove',e=>{if(drag)fromTrack(e)});
track.addEventListener('pointerup',()=>drag=false);track.addEventListener('pointercancel',()=>drag=false);
ch.addEventListener('pointerdown',e=>{
 const r=ch.getBoundingClientRect(),t=(performance.now()-t0)/1000,B=body(t,r),a=B[0],b=B[1],x=e.clientX-r.left,y=e.clientY-r.top,da=Math.hypot(x-a.x,y-a.y),db=Math.hypot(x-b.x,y-b.y),va=vis(a),vb=vis(b);
 pointer={x,y,down:true};shock=1;shockSide=(db<da?1:0);
 hint.textContent=(shockSide?'RIGHT':'LEFT')+' PIECE TOUCHED. BOTH FLINCHED.';
 if((va<.04&&shockSide===0)||(vb<.04&&shockSide===1))hint.textContent='YOU TOUCHED A PIECE THAT IS NOT IN YOUR SLICE.'
});
ch.addEventListener('pointermove',e=>{const r=ch.getBoundingClientRect();pointer.x=e.clientX-r.left;pointer.y=e.clientY-r.top});
ch.addEventListener('pointerup',()=>pointer.down=false);ch.addEventListener('pointercancel',()=>pointer.down=false);
document.querySelector('#drift').onclick=()=>{auto=true;t0=performance.now()-Math.asin(Math.max(-1,Math.min(1,W/.68)))/.23*1000;hint.textContent='IT BREATHES THROUGH W.'};
document.querySelector('#call').onclick=()=>{call=1;shock=.7;hint.textContent='THE PIECES LEAN TOGETHER. THEY NEVER QUITE MEET.'};
requestAnimationFrame(draw);
</script>
</body>
</html>
